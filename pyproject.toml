[project]
name = "ai-career-radar"
version = "0.1.0"
description = "AI recruiting and research trend dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "httpx>=0.28,<1",
  "h2>=4.3,<5",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "python-dateutil>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
